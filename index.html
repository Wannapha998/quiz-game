(2,1fr);gap:10px;margin:20px 0}.choiceStep,.diagnoseBtn{padding:17px;border-radius:13px;border:1px solid #315170;background:#091624;color:#edf6ff;cursor:pointer;text-align:left}.choiceStep.selected{border-color:#58e6ff;background:#58e6ff15}.sequence{min-height:58px;padding:14px;border:1px dashed #315170;border-radius:13px;color:#9bb0c8}.sequence span{display:inline-block;padding:9px;margin:3px;background:#13243a;border-radius:8px;color:#fff}.diagnose{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.diagnoseBtn:hover,.choiceStep:hover{border-color:#58e6ff}.diagnoseBtn small{color:#9bb0c8}.finalScore{font-size:65px;font-weight:900;color:#ffd166;margin:18px}.finalScore small{font-size:18px;color:#9bb0c8}.resultBox{text-align:center}.resultBox strong{font-size:30px;color:#ffd166}.resultBox p{margin:10px}.score{color:#65e6a2}.top b{letter-spacing:.5px}\n@media(max-width:700px){.screen{padding:16px}.items,.selects{grid-template-columns:1fr 1fr}.diagnose,.stepChoices{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.hero{margin:5vh auto}.panel{padding:20px}.hero h1{font-size:50px}}\n</style>\n\n\n", "script": "\n(() => {\nlet playerName=\"\",score=0,hints=3,seq=[];\nconst $=id=>document.getElementById(id);\nconst screens=[...document.querySelectorAll(\".screen\")];\nfunction show(id){screens.forEach(s=>s.classList.remove(\"active\"));$(id).classList.add(\"active\");window.scrollTo(0,0);update()}\nfunction update(){\n document.querySelectorAll(\".score\").forEach(e=>e.textContent=score);\n document.querySelectorAll(\".hintCount\").forEach(e=>e.textContent=hints);\n}\nfunction hint(n){\n if(hints<=0)return;\n hints--; score=Math.max(0,score-5);\n const texts={1:\"ตัวช่วย: CPU = ประมวลผล, RAM = หน่วยความจำ, SSD = จัดเก็บข้อมูล, แป้นพิมพ์ = รับข้อมูล, จอภาพ = แสดงผล\",\n 2:\"ตัวช่วย: เปิดเครื่อง → เริ่มต้นตรวจสอบฮาร์ดแวร์ → อุปกรณ์สำหรับบูต → ระบบปฏิบัติการ\",\n 3:\"ตัวช่วย: ข้อความ “No Boot Device” เกี่ยวข้องกับอุปกรณ์ที่ระบบใช้ค้นหาเพื่อเริ่มระบบ\"};\n $(\"f\"+n).className=\"feedback good\";$(\"f\"+n).textContent=\"💡 \"+texts[n];update()\n}\n$(\"startBtn\").addEventListener(\"click\",()=>{\n const v=$(\"playerName\").value.trim();\n if(!v){$(\"nameError\").textContent=\"กรุณากรอกชื่อก่อนเริ่มเกม\";return}\n playerName=v;$(\"missionName\").textContent=v;show(\"missionPage\")\n});\n$(\"playerName\").addEventListener(\"keydown\",e=>{if(e.key===\"Enter\")$(\"startBtn\").click()});\n$(\"toLevel1\").addEventListener(\"click\",()=>show(\"level1Page\"));\n$(\"hint1\").addEventListener(\"click\",()=>hint(1));\n$(\"check1\").addEventListener(\"click\",()=>{\n const ans=[\"p\",\"m\",\"s\",\"i\",\"o\"],got=[1,2,3,4,5].map(i=>$(\"a\"+i).value);\n if(got.every((v,i)=>v===ans[i])){score+=30;$(\"f1\").className=\"feedback good\";$(\"f1\").textContent=\"✓ ถูกต้อง! คุณผ่านด่านที่ 1 และได้รับ 30 คะแนน\";update();setTimeout(()=>show(\"level1Result\"),500)}\n else{$(\"f1\").className=\"feedback bad\";$(\"f1\").textContent=\"✗ ยังไม่ถูกต้อง ลองตรวจหน้าที่ของอุปกรณ์แต่ละชนิดอีกครั้ง\"}\n});\n$(\"toLevel2\").addEventListener(\"click\",()=>show(\"level2Page\"));\ndocument.querySelectorAll(\".choiceStep\").forEach(btn=>btn.addEventListener(\"click\",()=>{\n if(btn.classList.contains(\"selected\"))return;btn.classList.add(\"selected\");seq.push(btn.textContent);\n $(\"sequence\").innerHTML=seq.map((x,i)=>`<span>${i+1}. ${x}</span>`).join(\"\");\n}));\n$(\"reset2\").addEventListener(\"click\",()=>{seq=[];document.querySelectorAll(\".choiceStep\").forEach(b=>b.classList.remove(\"selected\"));$(\"sequence\").textContent=\"ลำดับที่เลือกจะแสดงที่นี่…\"});\n$(\"hint2\").addEventListener(\"click\",()=>hint(2));\n$(\"check2\").addEventListener(\"click\",()=>{\n const ans=[\"เปิดเครื่อง\",\"เริ่มต้นตรวจสอบฮาร์ดแวร์\",\"อุปกรณ์สำหรับบูต\",\"ระบบปฏิบัติการ\"];\n if(JSON.stringify(seq)===JSON.stringify(ans)){score+=30;$(\"f2\").className=\"feedback good\";$(\"f2\").textContent=\"✓ ถูกต้อง! คุณผ่านด่านที่ 2 และได้รับ 30 คะแนน\";update();setTimeout(()=>show(\"level2Result\"),500)}\n else{$(\"f2\").className=\"feedback bad\";$(\"f2\").textContent=\"✗ ลำดับยังไม่ถูกต้อง ลองเรียงจากการเปิดเครื่องไปจนถึงระบบปฏิบัติการ\"}\n});\n$(\"toLevel3\").addEventListener(\"click\",()=>show(\"level3Page\"));\n$(\"hint3\").addEventListener(\"click\",()=>hint(3));\ndocument.querySelectorAll(\".diagnoseBtn\").forEach(btn=>btn.addEventListener(\"click\",()=>{\n if(btn.dataset.answer===\"yes\"){\n  score+=30;$(\"f3\").className=\"feedback good\";$(\"f3\").textContent=\"✓ ถูกต้อง! คุณผ่านด่านที่ 3 และได้รับ 30 คะแนน\";update();setTimeout(()=>finish(),600)\n }else{$(\"f3\").className=\"feedback bad\";$(\"f3\").textContent=\"✗ ยังไม่ใช่จุดหลักของปัญหา ลองพิจารณาความหมายของ “No Boot Device” อีกครั้ง\"}\n}));\nfunction finish(){show(\"finalPage\");$(\"finalName\").textContent=playerName;$(\"finalScore\").textContent=score;$(\"resultText\").textContent=score>=80?\"ยอดเยี่ยม! คุณผ่านภารกิจและทำคะแนนได้ดีมาก\":\"ภารกิจสำเร็จ! ลองทบทวนเนื้อหาแล้วเล่นอีกครั้งเพื่อเพิ่มคะแนน\"}\n$(\"restart\").addEventListener(\"click\",()=>host.reset());\nupdate();\n})();\n", "handlers": [], "fnames": ["show", "update", "hint", "finish"]}, {"id": 5, "title": "Simulation Decision Game - IT Lab Manager Simulation", "css": "\n        :root {\n            --bg-color: #0f172a;\n            --card-bg: #1e293b;\n            --primary: #38bdf8;\n            --accent: #818cf8;\n            --primary-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);\n            --text-main: #f8fafc;\n            --text-muted: #94a3b8;\n            --border: #334155;\n            --success: #22c55e;\n            --warning: #f59e0b;\n            --error: #ef4444;\n        }\n\n        :host{\n            font-family: system-ui, 'Noto Sans Thai', sans-serif;\n            background-color: var(--bg-color);\n            color: var(--text-main);\n            margin: 0;\n            padding: 0;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            min-height: 100vh;\n        }\n\n        .container {\n            width: 100%;\n            max-width: 800px;\n            background: var(--card-bg);\n            padding: 2rem;\n            border-radius: 20px;\n            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);\n            border: 1px solid var(--border);\n            box-sizing: border-box;\n            position: relative;\n            overflow: hidden;\n        }\n\n        .container::before {\n            content: '';\n            position: absolute;\n            top: 0;\n            left: 0;\n            width: 100%;\n            height: 6px;\n            background: var(--primary-gradient);\n        }\n\n        /* หน้าปกเกม */\n        .hero-badge {\n            width: 75px;\n            height: 75px;\n            background: var(--primary-gradient);\n            border-radius: 50%;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            margin: 0 auto 1rem auto;\n            box-shadow: 0 10px 20px -3px rgba(56, 189, 248, 0.4);\n            animation: float 3s ease-in-out infinite;\n        }\n\n        .hero-badge svg {\n            width: 38px;\n            height: 38px;\n            fill: #0f172a;\n        }\n\n        @keyframes float {\n            0%, 100% { transform: translateY(0); }\n            50% { transform: translateY(-6px); }\n        }\n\n        h1 {\n            background: var(--primary-gradient);\n            -webkit-background-clip: text;\n            -webkit-text-fill-color: transparent;\n            text-align: center;\n            margin-bottom: 0.25rem;\n            font-size: 2rem;\n            font-weight: 700;\n        }\n\n        p.sub {\n            text-align: center;\n            color: var(--text-muted);\n            margin-bottom: 1.5rem;\n            font-size: 0.95rem;\n        }\n\n        .form-group {\n            margin-bottom: 1.25rem;\n        }\n\n        label {\n            display: block;\n            margin-bottom: 0.5rem;\n            font-weight: 600;\n        }\n\n        input[type=\"text\"] {\n            width: 100%;\n            padding: 0.85rem 1rem;\n            background-color: #0f172a;\n            border: 2px solid var(--border);\n            border-radius: 12px;\n            color: white;\n            font-size: 1rem;\n            font-family: system-ui, 'Noto Sans Thai', sans-serif;\n            outline: none;\n            box-sizing: border-box;\n            transition: all 0.3s ease;\n        }\n\n        input[type=\"text\"]:focus {\n            border-color: var(--primary);\n            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);\n        }\n\n        button {\n            background: var(--primary-gradient);\n            color: #0f172a;\n            border: none;\n            padding: 0.85rem 2rem;\n            font-size: 1rem;\n            font-weight: 700;\n            font-family: system-ui, 'Noto Sans Thai', sans-serif;\n            border-radius: 12px;\n            cursor: pointer;\n            transition: all 0.3s ease;\n            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);\n            width: 100%;\n        }\n\n        button:hover {\n            transform: translateY(-2px);\n            opacity: 0.95;\n            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4);\n        }\n\n        /* Dashboard แสดงสถานะเกม */\n        .dashboard-grid {\n            display: grid;\n            grid-template-columns: repeat(4, 1fr);\n            gap: 10px;\n            margin-bottom: 1rem;\n        }\n\n        .stat-card {\n            background: #0f172a;\n            border: 1px solid var(--border);\n            padding: 10px;\n            border-radius: 10px;\n            text-align: center;\n        }\n\n        .stat-label {\n            font-size: 0.75rem;\n            color: var(--text-muted);\n            margin-bottom: 2px;\n        }\n\n        .stat-value {\n            font-size: 1rem;\n            font-weight: 700;\n            color: var(--primary);\n        }\n\n        .budget-highlight {\n            background: rgba(245, 158, 11, 0.1);\n            border: 1px solid var(--warning);\n            padding: 10px 15px;\n            border-radius: 10px;\n            font-weight: 600;\n            color: var(--warning);\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n            margin-bottom: 1rem;\n        }\n\n        .situation-box {\n            background: rgba(56, 189, 248, 0.08);\n            border: 1px dashed var(--primary);\n            padding: 1rem;\n            border-radius: 12px;\n            margin-bottom: 1rem;\n        }\n\n        .situation-title {\n            font-weight: 700;\n            color: var(--primary);\n            margin-bottom: 0.35rem;\n            font-size: 1.05rem;\n        }\n\n        .action-container {\n            display: flex;\n            flex-direction: column;\n            gap: 8px;\n            margin-bottom: 1rem;\n        }\n\n        .action-btn {\n            background: #0f172a;\n            color: var(--text-main);\n            border: 1px solid var(--border);\n            text-align: left;\n            padding: 0.8rem 1rem;\n            border-radius: 10px;\n            font-weight: 500;\n            cursor: pointer;\n            transition: all 0.2s;\n            width: 100%;\n            box-shadow: none;\n            font-family: system-ui, 'Noto Sans Thai', sans-serif;\n            font-size: 0.9rem;\n        }\n\n        .action-btn:hover {\n            border-color: var(--primary);\n            background: rgba(56, 189, 248, 0.05);\n            transform: none;\n        }\n\n        .panels-grid {\n            display: grid;\n            grid-template-columns: 1fr 1fr;\n            gap: 12px;\n        }\n\n        .panel {\n            background: #0f172a;\n            border: 1px solid var(--border);\n            border-radius: 10px;\n            padding: 10px;\n            max-height: 120px;\n            overflow-y: auto;\n            font-size: 0.8rem;\n        }\n\n        .panel h4 {\n            margin: 0 0 6px 0;\n            color: var(--text-muted);\n            font-size: 0.85rem;\n            border-bottom: 1px solid var(--border);\n            padding-bottom: 3px;\n        }\n\n        /* หน้าจอสรุปผล */\n        .summary-box {\n            background: #0f172a;\n            border: 1px solid var(--border);\n            border-radius: 10px;\n            padding: 12px;\n            margin-bottom: 1rem;\n            max-height: 180px;\n            overflow-y: auto;\n            text-align: left;\n            font-size: 0.85rem;\n        }\n\n        .history-row {\n            padding: 6px 0;\n            border-bottom: 1px solid var(--border);\n        }\n\n        .hidden { display: none !important; }\n    ", "body": "\n\n    <div class=\"container\">\n        <!-- หน้าปกเกม: Simulation Decision Game -->\n        <div id=\"start-screen\">\n            <div class=\"hero-badge\">\n                <svg viewBox=\"0 0 24 24\">\n                    <path d=\"M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z\"/>\n                </svg>\n            </div>\n            <h1>IT LAB MANAGER SIMULATION</h1>\n            <p class=\"sub\">🎮 Simulation Decision Game: เกมบริหารแล็บคอมพิวเตอร์ ด้วยงบจำกัด 5,000 บาท[cite: 3]</p>\n            \n            <div class=\"form-group\">\n                <label for=\"username\">กรอกชื่อผู้จัดการแล็บของคุณ:</label>\n                <input type=\"text\" id=\"username\" placeholder=\"ระบุชื่อของคุณที่นี่...\" autocomplete=\"off\">\n            </div>\n            <button data-game-handler=\"startGame()\">🚀 เริ่มต้นรับภารกิจบริหารแล็บ</button>\n        </div>\n\n        <!-- หน้าจอเล่นเกม Simulation -->\n        <div id=\"game-screen\" class=\"hidden\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;\">\n                <span style=\"font-weight: 600; color: var(--text-muted); font-size: 0.9rem;\">ผู้จัดการ: <span id=\"disp-role\" style=\"color:var(--primary);\">ช่างเทคนิค</span></span>\n                <span style=\"font-weight: 600; color: var(--text-muted); font-size: 0.9rem;\">Turn: <span id=\"disp-turn\" style=\"color:var(--success);\">1</span> / 5</span>\n            </div>\n\n            <!-- Dashboard สถานะระบบ -->\n            <div class=\"dashboard-grid\">\n                <div class=\"stat-card\">\n                    <div class=\"stat-label\">CPU Load</div>\n                    <div class=\"stat-value\" id=\"stat-cpu\">35%</div>\n                </div>\n                <div class=\"stat-card\">\n                    <div class=\"stat-label\">RAM Usage</div>\n                    <div class=\"stat-value\" id=\"stat-ram\">40%</div>\n                </div>\n                <div class=\"stat-card\">\n                    <div class=\"stat-label\">Network</div>\n                    <div class=\"stat-value\" id=\"stat-net\">Normal</div>\n                </div>\n                <div class=\"stat-card\">\n                    <div class=\"stat-label\">สถานะภาพ</div>\n                    <div class=\"stat-value\" id=\"stat-status\" style=\"color:var(--success);\">ปกติ</div>\n                </div>\n            </div>\n\n            <div class=\"budget-highlight\">\n                <span>💰 งบประมาณจำกัดในการบริหารแล็บ</span>\n                <span id=\"stat-budget\" style=\"font-size: 1.15rem;\">5,000 บาท</span>\n            </div>\n\n            <!-- กล่องสถานการณ์ -->\n            <div class=\"situation-box\">\n                <div class=\"situation-title\" id=\"sit-title\">หัวข้อสถานการณ์</div>\n                <div id=\"sit-desc\" style=\"font-size: 0.9rem; line-height: 1.4;\">รายละเอียดเหตุการณ์...</div>\n            </div>\n\n            <!-- ปุ่มการกระทำ (Action Buttons) -->\n            <div class=\"action-container\" id=\"action-container\">\n                <!-- สร้างผ่าน JS ตามเงื่อนไข -->\n            </div>\n\n            <!-- Panels ล่าง: Event Log & Evidence Panel -->\n            <div class=\"panels-grid\">\n                <div class=\"panel\">\n                    <h4>📜 Event Log</h4>\n                    <div id=\"event-log-content\">ระบบเริ่มต้นเปิดให้บริการห้องปฏิบัติการ...</div>\n                </div>\n                <div class=\"panel\">\n                    <h4>🔍 Evidence Panel (หลักฐานและพารามิเตอร์)</h4>\n                    <div id=\"evidence-content\">- ตรวจสอบสถานะฮาร์ดแวร์พื้นฐานปกติ</div>\n                </div>\n            </div>\n        </div>\n\n        <!-- หน้าจอสรุปผล (Result & Final Report) -->\n        <div id=\"result-screen\" class=\"hidden\">\n            <h1>📊 สรุปผลการปฏิบัติงานแล็บ</h1>\n            <p class=\"sub\" id=\"res-manager-info\" style=\"margin-bottom: 0.5rem;\"></p>\n            \n            <div style=\"display: flex; gap: 10px; margin-bottom: 1rem;\">\n                <div class=\"stat-card\" style=\"flex:1;\">\n                    <div class=\"stat-label\">งบที่ใช้ไป</div>\n                    <div class=\"stat-value\" id=\"res-budget-used\" style=\"color:var(--warning);\">0 บาท</div>\n                </div>\n                <div class=\"stat-card\" style=\"flex:1;\">\n                    <div class=\"stat-label\">งบเหลือเก็บ</div>\n                    <div class=\"stat-value\" id=\"res-budget-left\" style=\"color:var(--success);\">5,000 บาท</div>\n                </div>\n                <div class=\"stat-card\" style=\"flex:1;\">\n                    <div class=\"stat-label\">Final Status</div>\n                    <div class=\"stat-value\" id=\"res-final-status\" style=\"color:var(--success);\">ยอดเยี่ยม</div>\n                </div>\n            </div>\n\n            <h4 style=\"margin: 0 0 4px 0; color: var(--text-muted); font-size: 0.85rem;\">📋 Decision History (ประวัติการตัดสินใจของคุณ):</h4>\n            <div class=\"summary-box\" id=\"history-container\">\n                <!-- รายการประวัติ -->\n            </div>\n\n            <h4 style=\"margin: 0 0 4px 0; color: var(--text-muted); font-size: 0.85rem;\">💡 Reflection (บทสะท้อนการเรียนรู้):</h4>\n            <div class=\"summary-box\" id=\"reflection-content\" style=\"max-height: 90px; font-size: 0.8rem; line-height: 1.3;\">\n                กำลังวิเคราะห์ผลการบริหารระบบ...\n            </div>\n\n            <button data-game-handler=\"restartGame()\" style=\"margin-top: 5px;\">🔄 เล่นใหม่อีกครั้ง</button>\n        </div>\n    </div>\n\n    \n", "script": "\n        // ข้อมูลสถานการณ์อ้างอิงจากหลักสูตร (ปรับงบให้สอดคล้องกับงบจำกัด 5,000 บาท)[cite: 3]\n        const simulationScenarios = [\n            {\n                turn: 1,\n                title: \"สถานการณ์ที่ 1: เครื่องคอมพิวเตอร์ในห้องปฏิบัติการแฮงค์บ่อยเนื่องจากความร้อน\",\n                cpu: \"85%\",\n                ram: \"60%\",\n                network: \"Normal\",\n                evidence: \"พบปัญหาความร้อนสูงที่ตัวประมวลผลกลาง (CPU) และระบบระบายความร้อนทำงานผิดปกติ[cite: 3]\",\n                actions: [\n                    { text: \"ทำความสะอาดพัดลม ทาซิลิโคนใหม่ และตั้งค่า Bios/UEFI (คุ้มค่า ถูกต้องตามหลักการ)\", cost: 800, nextCpu: \"40%\", nextRam: \"50%\", log: \"ซ่อมบำรุงระบบระบายความร้อนสำเร็จ CPU ทำงานลดลง[cite: 3]\" },\n                    { text: \"ปล่อยปละละเลยไม่ซ่อมแซม (ประหยัดงบแต่งบานปลายภายหลัง)\", cost: 0, nextCpu: \"95%\", nextRam: \"70%\", log: \"ละเลยการซ่อมบำรุง ทำให้อุปกรณ์เสื่อมสภาพเร็ว\" },\n                    { text: \"ซื้อชุดระบายความร้อนเกรดพรีเมียมราคาแพงทันที\", cost: 3500, nextCpu: \"30%\", nextRam: \"45%\", log: \"ระบายความร้อนดีเยี่ยมแต่งบประมาณเกือบหมดเกลี้ยง\" }\n                ]\n            },\n            {\n                turn: 2,\n                title: \"สถานการณ์ที่ 2: ผู้ใช้บ่นว่าเครื่องช้ามากเวลาเปิดโปรแกรมพร้อมกันหลายตัว\",\n                cpu: \"50%\",\n                ram: \"92%\",\n                network: \"Normal\",\n                evidence: \"หน่วยความจำชั่วคราว (RAM) เต็มพิกัด ส่งผลกระทบต่อการทำงานของระบบปฏิบัติการ[cite: 3]\",\n                actions: [\n                    { text: \"อัปเกรดเพิ่ม RAM และจัดการโปรแกรมยูทิลิตีตรวจสอบระบบอย่างคุ้มค่า\", cost: 1500, nextCpu: \"45%\", nextRam: \"45%\", log: \"อัปเกรด RAM สำเร็จ หน่วยความจำเพียงพอใช้งาน[cite: 3]\" },\n                    { text: \"ปิดโปรแกรมแล้วปล่อยผ่านโดยไม่เพิ่มอุปกรณ์\", cost: 0, nextCpu: \"50%\", nextRam: \"85%\", log: \"แก้ปัญหาชั่วคราว แต่หน่วยความจำยังคงหนาแน่น\" },\n                    { text: \"เปลี่ยนแผงวงจรหลัก (Mainboard) และอุปกรณ์ยกชุดใหม่หมด\", cost: 4500, nextCpu: \"30%\", nextRam: \"30%\", log: \"เปลี่ยนอุปกรณ์ใหม่หมดแต่เกินงบประมาณที่มี\" }\n                ]\n            },\n            {\n                turn: 3,\n                title: \"สถานการณ์ที่ 3: อุปกรณ์ I/O ขัดข้องและสัญญาณขัดแย้ง (IRQ Conflict / I/O Address)\",\n                cpu: \"60%\",\n                ram: \"50%\",\n                network: \"High Load\",\n                evidence: \"ตรวจสอบฮาร์ดแวร์พบปัญหาความขัดแย้งของ Interrupt Request (IRQ) และ DMA[cite: 3]\",\n                actions: [\n                    { text: \"กำหนดค่าระบบ IRQ, I/O Address และ DMA ใหม่ให้ถูกต้องผ่าน Bios/UEFI[cite: 3]\", cost: 500, nextCpu: \"40%\", nextRam: \"45%\", log: \"ตั้งค่าสัญญาณ IRQ และ I/O Address สำเร็จ อุปกรณ์ทำงานปกติ[cite: 3]\" },\n                    { text: \"สลับพอร์ตเชื่อมต่อ Peripheral Port ไปเรื่อยๆ โดยไม่ตั้งค่าระบบ\", cost: 100, nextCpu: \"70%\", nextRam: \"55%\", log: \"แก้ปัญหาไม่ตรงจุด อุปกรณ์ยังคงเกิดความขัดแย้ง\" },\n                    { text: \"ถอดอุปกรณ์ต่อพ่วงทั้งหมดออกแล้วยกเลิกใช้งาน\", cost: 0, nextCpu: \"30%\", nextRam: \"30%\", log: \"ตัดปัญหาโดยการปิดการใช้งานอุปกรณ์ต่อพ่วง\" }\n                ]\n            },\n            {\n                turn: 4,\n                title: \"สถานการณ์ที่ 4: ต้องการติดตั้งระบบปฏิบัติการและไดรเวอร์ชุดใหม่ให้พร้อมเรียน\",\n                cpu: \"40%\",\n                ram: \"45%\",\n                network: \"Normal\",\n                evidence: \"ต้องจัดเตรียม ติดตั้ง OS, โปรแกรมไดรเวอร์ และโปรแกรมประยุกต์ตามความต้องการ[cite: 3]\",\n                actions: [\n                    { text: \"จัดทำแผนติดตั้งระบบปฏิบัติการ ไดรเวอร์ และโปรแกรมประยุกต์มาตรฐาน[cite: 3]\", cost: 1000, nextCpu: \"35%\", nextRam: \"40%\", log: \"ติดตั้งซอฟต์แวร์ครบถ้วนพร้อมทดสอบการทำงานของระบบ[cite: 3]\" },\n                    { text: \"ใช้แผ่นโปรแกรมเถื่อนและไม่มีการจัดการไดรเวอร์ที่ถูกต้อง\", cost: 200, nextCpu: \"75%\", nextRam: \"85%\", log: \"ระบบเสี่ยงต่อปัญหาซอฟต์แวร์และจอฟ้า\" },\n                    { text: \"ปล่อยให้ผู้ใช้งานติดตั้งซอฟต์แวร์กันเองตามอิสระ\", cost: 0, nextCpu: \"60%\", nextRam: \"70%\", log: \"ระบบขาดความเป็นระเบียบเรียบร้อย\" }\n                ]\n            },\n            {\n                turn: 5,\n                title: \"สถานการณ์ที่ 5: ตรวจสอบความปลอดภัยและบำรุงรักษาก่อนส่งมอบงานขั้นสุดท้าย\",\n                cpu: \"45%\",\n                ram: \"40%\",\n                network: \"Normal\",\n                evidence: \"ประเมินภาพรวมระบบรักษาความปลอดภัยพื้นฐานและการบำรุงรักษาเครื่องคอมพิวเตอร์[cite: 3]\",\n                actions: [\n                    { text: \"ทำความสะอาดระบบ สแกนไวรัส และทำระบบรักษาความปลอดภัยพื้นฐาน[cite: 3]\", cost: 800, nextCpu: \"30%\", nextRam: \"35%\", log: \"บำรุงรักษาและป้องกันความปลอดภัยพร้อมให้บริการ[cite: 3]\" },\n                    { text: \"ปิดระบบและส่งมอบทันทีโดยไม่ตรวจสอบ\", cost: 0, nextCpu: \"50%\", nextRam: \"45%\", log: \"ส่งมอบงานโดยไม่มีการตรวจสอบความปลอดภัยพื้นฐาน\" },\n                    { text: \"ซื้อซอฟต์แวร์สแกนไวรัสราคาแพงเกินความจำเป็นทันที\", cost: 4000, nextCpu: \"30%\", nextRam: \"35%\", log: \"ระบบปลอดภัยดีแต่งบประมาณเกินขีดจำกัด\" }\n                ]\n            }\n        ];\n\n        let managerName = \"\";\n        let currentTurnIndex = 0;\n        let budget = 5000;\n        let totalBudgetUsed = 0;\n        let decisionHistory = [];\n        let currentCpu = \"35%\";\n        let currentRam = \"40%\";\n        let currentNet = \"Normal\";\n\n        function startGame() {\n            const nameInput = document.getElementById(\"username\").value.trim();\n            if (!nameInput) {\n                notify(\"กรุณากรอกชื่อผู้จัดการแล็บก่อนเริ่มเกมครับ!\");\n                return;\n            }\n            managerName = nameInput;\n            document.getElementById(\"disp-role\").textContent = `${managerName}`;\n            \n            document.getElementById(\"start-screen\").classList.add(\"hidden\");\n            document.getElementById(\"game-screen\").classList.remove(\"hidden\");\n\n            currentTurnIndex = 0;\n            budget = 5000;\n            totalBudgetUsed = 0;\n            decisionHistory = [];\n            currentCpu = \"35%\";\n            currentRam = \"40%\";\n            currentNet = \"Normal\";\n\n            loadTurn();\n        }\n\n        function loadTurn() {\n            if (currentTurnIndex >= simulationScenarios.length) {\n                endSimulation();\n                return;\n            }\n\n            const data = simulationScenarios[currentTurnIndex];\n            document.getElementById(\"disp-turn\").textContent = currentTurnIndex + 1;\n            document.getElementById(\"stat-cpu\").textContent = currentCpu;\n            document.getElementById(\"stat-ram\").textContent = currentRam;\n            document.getElementById(\"stat-net\").textContent = currentNet;\n            document.getElementById(\"stat-budget\").textContent = `${budget.toLocaleString()} บาท`;\n            \n            let statusText = \"ปกติ\";\n            let statusColor = \"var(--success)\";\n            if (parseInt(currentCpu) > 70 || parseInt(currentRam) > 80) {\n                statusText = \"วิกฤต\";\n                statusColor = \"var(--error)\";\n            }\n            const statStatusEl = document.getElementById(\"stat-status\");\n            statStatusEl.textContent = statusText;\n            statStatusEl.style.color = statusColor;\n\n            document.getElementById(\"sit-title\").textContent = data.title;\n            document.getElementById(\"sit-desc\").textContent = `เกิดปัญหาในระบบ: เลือกวิธีจัดการทรัพยากรให้เหมาะสมกับงบประมาณที่มี`;\n            document.getElementById(\"evidence-content\").innerHTML = `- <b>หลักฐานพารามิเตอร์:</b> ${data.evidence}`;\n\n            const actionContainer = document.getElementById(\"action-container\");\n            actionContainer.innerHTML = \"\";\n\n            data.actions.forEach((act, idx) => {\n                const btn = document.createElement(\"button\");\n                btn.className = \"action-btn\";\n                btn.innerHTML = `<b>ทางเลือกที่ ${idx + 1}:</b> ${act.text} <br><span style=\"font-size:0.75rem; color:var(--warning);\">ค่าใช้จ่าย: ${act.cost.toLocaleString()} บาท</span>`;\n                btn.onclick = () => executeAction(act);\n                actionContainer.appendChild(btn);\n            });\n        }\n\n        function executeAction(act) {\n            if (budget < act.cost) {\n                notify(\"งบประมาณ 5,000 บาทของคุณไม่เพียงพอสำหรับตัวเลือกนี้!\");\n                return;\n            }\n\n            budget -= act.cost;\n            totalBudgetUsed += act.cost;\n            currentCpu = act.nextCpu;\n            currentRam = act.nextRam;\n\n            const logContent = document.getElementById(\"event-log-content\");\n            logContent.innerHTML = `[Turn ${currentTurnIndex + 1}] ${act.log}<br>` + logContent.innerHTML;\n\n            decisionHistory.push({\n                turn: currentTurnIndex + 1,\n                situation: simulationScenarios[currentTurnIndex].title,\n                actionChosen: act.text,\n                cost: act.cost\n            });\n\n            currentTurnIndex++;\n            loadTurn();\n        }\n\n        function endSimulation() {\n            document.getElementById(\"game-screen\").classList.add(\"hidden\");\n            document.getElementById(\"result-screen\").classList.remove(\"hidden\");\n\n            document.getElementById(\"res-manager-info\").textContent = `ผู้จัดการ: ${managerName}`;\n            document.getElementById(\"res-budget-used\").textContent = `${totalBudgetUsed.toLocaleString()} บาท`;\n            document.getElementById(\"res-budget-left\").textContent = `${budget.toLocaleString()} บาท`;\n\n            let finalStatus = \"ยอดเยี่ยม (Professional Manager)\";\n            let colorStatus = \"var(--success)\";\n            if (budget < 0 || totalBudgetUsed > 4500) {\n                finalStatus = \"ต้องปรับปรุง (งบเกือบหมดหรือบริหารเกินขีดจำกัด)\";\n                colorStatus = \"var(--warning)\";\n            }\n            const statusEl = document.getElementById(\"res-final-status\");\n            statusEl.textContent = finalStatus;\n            statusEl.style.color = colorStatus;\n\n            const historyContainer = document.getElementById(\"history-container\");\n            historyContainer.innerHTML = \"\";\n            decisionHistory.forEach(h => {\n                const row = document.createElement(\"div\");\n                row.className = \"history-row\";\n                row.innerHTML = `<b>Turn ${h.turn}:</b> ${h.situation}<br><span style=\"color:var(--primary);\">↳ การตัดสินใจ:</span> ${h.actionChosen} (<span style=\"color:var(--warning);\">-${h.cost.toLocaleString()} บาท</span>)`;\n                historyContainer.appendChild(row);\n            });\n\n            const reflectionEl = document.getElementById(\"reflection-content\");\n            reflectionEl.innerHTML = `\n                • <b>การประเมินการบริหารแล็บ:</b> การจัดการระบบคอมพิวเตอร์และอุปกรณ์ต่อพ่วงจำเป็นต้องวางแผนการซ่อมบำรุงและตั้งค่าทรัพยากร (เช่น IRQ, RAM, CPU) ให้คุ้มค่ากับงบจำกัด[cite: 3]<br>\n                • <b>ข้อสรุป:</b> การตัดสินใจที่ถูกต้องตามหลักวิชาการช่วยยืดอายุการใช้งานอุปกรณ์และรักษาเสถียรภาพของระบบในห้องปฏิบัติการได้เป็นอย่างดี[cite: 3]\n            `;\n        }\n\n        function restartGame() {\n            document.getElementById(\"result-screen\").classList.add(\"hidden\");\n            document.getElementById(\"start-screen\").classList.remove(\"hidden\");\n            document.getElementById(\"username\").value = \"\";\n        }\n    ", "handlers": ["startGame()", "restartGame()"], "fnames": ["startGame", "loadTurn", "executeAction", "endSimulation", "restartGame"]}];
const home = document.getElementById("home");
let slots = Array.from(document.querySelectorAll(".slot"));
const buttons = Array.from(document.querySelectorAll("[data-game]"));
let activeGame = -1;

function makeNotify(root){
  return function notify(message, kind="info"){
    let toast = root.querySelector(".__game_toast");
    if(!toast){
      toast=document.createElement("div");
      toast.className="__game_toast";
      Object.assign(toast.style,{position:"fixed",left:"50%",bottom:"28px",transform:"translateX(-50%)",zIndex:"2147483647",maxWidth:"min(92vw,620px)",padding:"13px 18px",borderRadius:"14px",background:"rgba(7,17,31,.96)",color:"#fff",border:"1px solid #58e6ff",boxShadow:"0 12px 40px rgba(0,0,0,.35)",fontWeight:"700",textAlign:"center",lineHeight:"1.5"});
      root.appendChild(toast);
    }
    toast.textContent=message;
    toast.style.borderColor=kind==="error"?"#ff6b7a":"#58e6ff";
    clearTimeout(toast._timer);
    toast._timer=setTimeout(()=>toast.remove(),2200);
  };
}

function resetSlot(index){
  const old=document.getElementById("slot-"+index);
  const fresh=document.createElement("div");
  fresh.className="slot";
  fresh.id="slot-"+index;
  old.replaceWith(fresh);
  slots[index]=fresh;
  mountGame(index);
  if(activeGame===index) fresh.classList.add("active");
}

function mountGame(index){
  const host=document.getElementById("slot-"+index);
  const src=GAME_SOURCES[index];
  host.innerHTML="";
  const shadow=host.attachShadow({mode:"open"});
  const style=document.createElement("style");
  style.textContent=src.css+`.__game_toast{font-family:system-ui,"Noto Sans Thai",sans-serif}`;
  shadow.appendChild(style);
  const content=document.createElement("div");
  content.innerHTML=src.body;
  shadow.appendChild(content);

  const notify=makeNotify(shadow);
  const docProxy=new Proxy(document,{
    get(target,prop){
      if(prop==="getElementById") return id=>shadow.querySelector("#"+CSS.escape(id));
      if(prop==="querySelector") return sel=>shadow.querySelector(sel);
      if(prop==="querySelectorAll") return sel=>shadow.querySelectorAll(sel);
      return Reflect.get(target,prop,target);
    }
  });

  let api={};
  try{
    const factory=new Function("document","notify","root","host",src.script+"\n"+"return {"+src.fnames.map(n=>n+":"+n).join(",")+"};");
    api=factory(docProxy,notify,shadow,host)||{};
  }catch(err){
    console.error("Game "+(index+1)+" init error:",err);
    host.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:30px"><div style="max-width:760px;padding:24px;border:1px solid #ff6b7a;border-radius:18px;background:#0e1b2d;color:#fff"><h2>เกิดข้อผิดพลาดในการโหลดเกม</h2><p>ระบบยังคงเปิดเกมอื่นได้ตามปกติ</p><pre style="white-space:pre-wrap;color:#ffc1c9">'+String(err.stack||err)+'</pre></div></div>';
    return;
  }

  shadow.querySelectorAll("[data-game-handler]").forEach(el=>{
    const expr=el.getAttribute("data-game-handler")||"";
    el.addEventListener("click",()=>{
      try{
        const m=expr.match(/^\s*([A-Za-z_$][\w$]*)\s*\((.*)\)\s*$/s);
        if(!m||typeof api[m[1]]!=="function") throw new Error("ไม่พบฟังก์ชัน "+(m&&m[1]||expr));
        const args=m[2].trim()?Function("return ["+m[2]+"]")():[];
        api[m[1]](...args);
      }catch(e){console.error(e);notify("เกิดข้อผิดพลาด: "+e.message,"error");}
    });
    el.removeAttribute("data-game-handler");
  });
}

function showGame(index){
  if(index===-1){
    activeGame=-1;
    home.style.display="block";
    slots.forEach(s=>s.classList.remove("active"));
    buttons.forEach(b=>b.classList.toggle("active",b.dataset.game==="-1"));
    document.getElementById("status").textContent="หน้าหลัก • เลือกเกมที่ต้องการเล่น";
    return;
  }
  activeGame=index;
  home.style.display="none";
  slots.forEach((s,i)=>s.classList.toggle("active",i===index));
  buttons.forEach(b=>b.classList.toggle("active",Number(b.dataset.game)===index));
  document.getElementById("status").textContent="กำลังเล่น: เกม "+(index+1)+" • ทำงานในหน้าเดียว";
}

buttons.forEach(b=>b.addEventListener("click",()=>showGame(Number(b.dataset.game))));
for(let i=0;i<5;i++) mountGame(i);
showGame(-1);
</script>
